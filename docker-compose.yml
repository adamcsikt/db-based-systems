name: db-systems

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.3-alpine3.23
    container_name: db-systems-postgres-database
    restart: unless-stopped
    logging: *default-logging
    #ports:
    #  - "5432:5432"
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=50
      -c shared_buffers=32MB
      -c effective_cache_size=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
    env_file:
      - ./environment/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
      - ./postgres-init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    container_name: db-systems-pgadmin
    restart: always
    logging: *default-logging
    ports:
      - "5050:80"
    env_file:
      - ./environment/pgadmin.env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M

volumes:
  postgres_data:
  pgadmin_data:
